<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthApp | Inicio de sesión</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef4f8;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }

        .login {
            background: white;
            width: 85%;
            max-width: 360px;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0001;
        }

        h1 {
            color: #147d92;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 16px;
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 6px;
        }

        input {
            border: 1px solid #aaa;
        }

        button {
            margin-top: 22px;
            border: 0;
            background: #147d92;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="login">
        <h1>HealthApp</h1>
        <p>Inicia sesión para continuar</p>

        <form>
            <label for="email">Correo electrónico</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <button type="submit">Iniciar sesión</button>
        </form>
    </main>
</body>
</html>
